name: CI / CD

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*.*.*']

jobs:
  typecheck:
    name: TypeScript 类型检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm exec vue-tsc -b

  release:
    name: 构建并发布 tag
    runs-on: ubuntu-latest
    needs: typecheck
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 同步 package.json 与 tag 版本号
        # tag 形如 v1.2.3，manifest version 不能带 v 前缀
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "构建版本: $VERSION"
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '$VERSION';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: 构建产物
        run: pnpm build

      - name: 校验产物
        run: |
          test -d dist || (echo "❌ dist/ 未生成" && exit 1)
          test -f release/crx-fuliba-power-*.zip || (echo "❌ release/*.zip 未生成" && exit 1)
          echo "✅ 产物校验通过"

      - name: 创建 GitHub Release 并上传 zip
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.zip
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
